# Approve install/build scripts: esbuild (@uvrn/embed UMD bundle) and better-sqlite3
# (@uvrn/store-sqlite native driver). pnpm 11 otherwise exits non-zero on a fresh
# install with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  better-sqlite3: true
onlyBuiltDependencies:
  - esbuild
  - better-sqlite3
